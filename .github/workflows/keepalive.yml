# Tiene sveglio il progetto Supabase gratuito (che va in pausa dopo 7 giorni senza chiamate):
# ogni 12 ore GitHub fa una piccola lettura al database. Una volta a settimana aggiorna anche
# il file .keepalive, così GitHub non spegne il timer per "repository inattivo" (succede dopo 60 giorni).
name: Tieni sveglio Supabase
on:
  schedule:
    - cron: "17 6,18 * * *"     # ogni giorno alle 06:17 e 18:17 UTC
  workflow_dispatch:            # si può lanciare a mano da GitHub → Actions
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Chiama il database
        env:
          KEY: sb_publishable_yIq72Tx8gohzpKjui7oJMw_VTeNzqh5
        run: |
          curl -sf "https://pbohjckxocshkwoyjiko.supabase.co/rest/v1/impostazioni?select=chiave&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" && echo " -> Supabase risponde"
      - name: Segnalibro settimanale
        run: |
          f=.keepalive; oggi=$(date -u +%Y-%m-%d)
          ultimo=$(cat $f 2>/dev/null || echo 2000-01-01)
          giorni=$(( ( $(date -u -d "$oggi" +%s) - $(date -u -d "$ultimo" +%s) ) / 86400 ))
          if [ "$giorni" -ge 7 ]; then
            echo "$oggi" > $f
            git config user.name "keepalive"; git config user.email "keepalive@users.noreply.github.com"
            git add $f && git commit -m "keepalive $oggi" && git push
          else
            echo "segnalibro aggiornato $giorni giorni fa, niente da fare"
          fi
